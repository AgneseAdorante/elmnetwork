num_hidden: 128
output_embedding: "linear_layer"
layer_config:
  input_wiring: "random"
  input_wiring_args:
    recurrent_connect: 0.0588
  neuron_config:
    neuron_activation: 'relu'
    input_scale: 10.0
    num_branch: 65
    num_synapse_per_branch: 16
    num_memory: 3
    memory_tau_min: 0.1
    memory_tau_max: 100.0
    neuronio_synapse_init: 1.0
    synapse_rect: 'relu'
  input_dropout: 0.2
  recurrent_dropout: 0.2
last_layer_override:
  # overrides layer_config
  input_wiring: "fully_connected"
  input_wiring_args:
    include_feedforward: True
    include_recurrent: False
  neuron_config:
    num_memory: 5
    num_branch: 8
    num_synapse_per_branch: 16
    mlp_num_hidden_layer: 0
